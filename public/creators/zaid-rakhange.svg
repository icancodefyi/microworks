<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <linearGradient id="bg-zaid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="aura-zaid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97757"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="skin-zaid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffedd5"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>
    <filter id="shadow-zaid" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="240" height="240" rx="40" fill="url(#bg-zaid)"/>
  <circle cx="120" cy="110" r="85" fill="#D97757" opacity="0.15" filter="blur(22px)"/>

  <!-- Halo Ring -->
  <circle cx="120" cy="110" r="76" fill="none" stroke="url(#aura-zaid)" stroke-width="2.5" opacity="0.7" stroke-dasharray="6,4"/>

  <!-- Shoulders / Modern Jacket -->
  <g filter="url(#shadow-zaid)">
    <path d="M42 225 C44 165 72 150 120 150 C168 150 196 165 198 225 Z" fill="#1e1b4b"/>
    <path d="M96 156 L120 185 L144 156 Z" fill="#312e81"/>
  </g>

  <!-- Neck -->
  <path d="M104 124 L104 152 C104 160 136 160 136 152 L136 124 Z" fill="#fdba74" opacity="0.7"/>

  <!-- Head / Face -->
  <ellipse cx="120" cy="100" rx="36" ry="42" fill="url(#skin-zaid)"/>

  <!-- Hair -->
  <path d="M82 86 C82 54 94 44 120 44 C146 44 158 54 158 86 C152 70 138 64 120 64 C102 64 88 70 82 86 Z" fill="#3f2314"/>

  <!-- Eyes -->
  <circle cx="104" cy="98" r="3.5" fill="#1e1b4b"/>
  <circle cx="136" cy="98" r="3.5" fill="#1e1b4b"/>

  <!-- Smile -->
  <path d="M106 118 Q120 128 134 118" fill="none" stroke="#9a3412" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Verified Creator Badge -->
  <g transform="translate(182, 26)">
    <circle cx="16" cy="16" r="16" fill="#ffffff" filter="url(#shadow-zaid)"/>
    <circle cx="16" cy="16" r="14" fill="url(#aura-zaid)"/>
    <path d="M11 16 L15 20 L22 12" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Brand Pill Tag -->
  <g transform="translate(24, 26)">
    <rect width="84" height="22" rx="11" fill="#1e1b4b" fill-opacity="0.9" stroke="#4338ca" stroke-width="1"/>
    <text x="42" y="15" fill="#fed7aa" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="0.5">IMPISEO</text>
  </g>
</svg>