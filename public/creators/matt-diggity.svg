<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <linearGradient id="bg-matt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1c1917"/>
    </linearGradient>
    <linearGradient id="aura-matt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97757"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="skin-matt" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#fdba74"/>
    </linearGradient>
    <filter id="shadow-matt" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="240" height="240" rx="40" fill="url(#bg-matt)"/>
  <circle cx="120" cy="110" r="85" fill="#D97757" opacity="0.12" filter="blur(20px)"/>

  <!-- Halo Ring -->
  <circle cx="120" cy="110" r="76" fill="none" stroke="url(#aura-matt)" stroke-width="2.5" opacity="0.6" stroke-dasharray="6,4"/>

  <!-- Shoulders / Jacket -->
  <g filter="url(#shadow-matt)">
    <path d="M42 225 C44 165 72 152 120 152 C168 152 196 165 198 225 Z" fill="#18181b"/>
    <!-- Collar / Shirt -->
    <path d="M96 156 L120 185 L144 156 Z" fill="#27272a"/>
    <path d="M106 154 L120 174 L134 154" fill="none" stroke="#D97757" stroke-width="2"/>
  </g>

  <!-- Neck -->
  <path d="M104 126 L104 155 C104 162 136 162 136 155 L136 126 Z" fill="#fb923c" opacity="0.8"/>

  <!-- Head / Face -->
  <ellipse cx="120" cy="102" rx="36" ry="44" fill="url(#skin-matt)"/>

  <!-- Short Stylized Hair -->
  <path d="M84 94 C84 62 100 52 120 52 C140 52 156 62 156 94 C150 82 144 76 120 76 C96 76 90 82 84 94 Z" fill="#1c1917"/>

  <!-- Stylish Glasses -->
  <g stroke="#0f172a" stroke-width="3" fill="#ffffff" fill-opacity="0.15">
    <rect x="91" y="92" width="23" height="17" rx="5"/>
    <rect x="126" y="92" width="23" height="17" rx="5"/>
    <line x1="114" y1="99" x2="126" y2="99" stroke-width="3"/>
  </g>
  <!-- Eyes -->
  <circle cx="102" cy="100" r="3.5" fill="#0f172a"/>
  <circle cx="138" cy="100" r="3.5" fill="#0f172a"/>

  <!-- Beard & Mustache -->
  <path d="M98 120 Q120 138 142 120 Q146 136 120 144 Q94 136 98 120 Z" fill="#292524"/>
  <path d="M110 118 Q120 124 130 118" fill="none" stroke="#1c1917" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Verified Creator Badge -->
  <g transform="translate(182, 26)">
    <circle cx="16" cy="16" r="16" fill="#ffffff" filter="url(#shadow-matt)"/>
    <circle cx="16" cy="16" r="14" fill="url(#aura-matt)"/>
    <path d="M11 16 L15 20 L22 12" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Brand Pill Tag -->
  <g transform="translate(24, 26)">
    <rect width="78" height="22" rx="11" fill="#1e293b" fill-opacity="0.9" stroke="#334155" stroke-width="1"/>
    <text x="39" y="15" fill="#fed7aa" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="0.5">300K+ YT</text>
  </g>
</svg>
